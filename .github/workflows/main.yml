name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [
          x86_64-unknown-linux-gnu,
          x86_64-apple-darwin,
          aarch64-unknown-linux-gnu,
          aarch64-unknown-none-softfloat,
          riscv32imac-unknown-none-elf,
          riscv64imac-unknown-none-elf,
        ]
    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        components: clippy
    - run: cargo clippy --all-features --target ${{ matrix.target }}
    - run: cargo doc --all-features --target ${{ matrix.target }}

  build-x86_64-none:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - run: cargo build --all-features --target x86_64-unknown-none
      - run: cargo doc --all-features --target x86_64-unknown-none

  test-x86_64:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features

  test-x86_64-bare-metal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - name: Install QEMU
        uses: pkgxdev/setup@v5
        with:
          +: qemu.org
      - name: Run trap round-trip test
        working-directory: examples/uefi
        run: |
          cargo build
          mkdir -p target/x86_64-unknown-uefi/debug/esp/EFI/Boot
          cp target/x86_64-unknown-uefi/debug/uefi.efi \
            target/x86_64-unknown-uefi/debug/esp/EFI/Boot/BootX64.efi
          set +e
          timeout 5 qemu-system-x86_64 \
            -bios OVMF.fd \
            -drive format=raw,file=fat:rw:target/x86_64-unknown-uefi/debug/esp \
            -net none \
            -nographic | tee qemu.log
          qemu_status=${PIPESTATUS[0]}
          set -e
          test "$qemu_status" -eq 124
          grep -q 'back from user' qemu.log
          grep -q 'TRAP: BreakPoint' qemu.log

  test-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - run: cross test --target aarch64-unknown-linux-gnu

  test-riscv:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [riscv32, riscv64]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}imac-unknown-none-elf
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-misc
      - name: Install 32-bit OpenSBI firmware
        if: matrix.arch == 'riscv32'
        run: |
          curl --fail --location --retry 3 \
            https://github.com/riscv-software-src/opensbi/releases/download/v1.9/opensbi-1.9-rv-bin.tar.xz \
            --output "$RUNNER_TEMP/opensbi.tar.xz"
          tar -xJf "$RUNNER_TEMP/opensbi.tar.xz" -C "$RUNNER_TEMP"
      - name: Run trap round-trip test
        working-directory: examples/riscv
        run: |
          target=${{ matrix.arch }}imac-unknown-none-elf
          bios=default
          if [ "${{ matrix.arch }}" = riscv32 ]; then
            bios="$RUNNER_TEMP/opensbi-1.9-rv-bin/share/opensbi/ilp32/generic/firmware/fw_dynamic.bin"
          fi
          cargo build --target "$target"
          timeout 30 qemu-system-${{ matrix.arch }} \
            -machine virt \
            -nographic \
            -bios "$bios" \
            -kernel "target/$target/debug/riscv" | tee qemu.log
          grep -q 'Back from user: Exception(UserEnvCall)' qemu.log
          grep -q 'TRAP: Breakpoint' qemu.log
          grep -q 'Exit...' qemu.log

  test-mipsel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-01
          components: rust-src
      - name: Install QEMU
        uses: pkgxdev/setup@v5
        with:
          +: qemu.org
      - name: Run trap round-trip test
        working-directory: examples/mipsel
        run: |
          cargo build
          set +e
          timeout 5 qemu-system-mipsel \
            -machine malta \
            -nographic \
            -kernel target/mipsel-unknown-none/debug/mipsel | tee qemu.log
          qemu_status=${PIPESTATUS[0]}
          set -e
          test "$qemu_status" -eq 124
          grep -q 'MIPS trap round-trip passed' qemu.log
